name: Android NDK Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Download and Setup NDK
      run: |
        wget https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
        unzip -q android-ndk-r25b-linux.zip
        echo "ANDROID_NDK_HOME=$PWD/android-ndk-r25b" >> $GITHUB_ENV

    - name: Compile Native Code
      run: |
        cd app/src/main
        $GITHUB_ENV/android-ndk-r25b/ndk-build || ./android-ndk-r25b/ndk-build

    - name: Upload Built Library
      uses: actions/upload-artifact@v4
      with:
        name: AssassinMenu-Library
        path: app/src/main/libs/
