name: Android NDK Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Android NDK
      uses: nttld/setup-ndk@v3
      with:
        ndk-version: r25b
        add-to-path: true

    - name: Compile Native Libraries
      run: |
        cd app/src/main
        ndk-build

    - name: Upload Built Library
      uses: actions/upload-artifact@v4
      with:
        name: AssassinMenu-Library
        path: app/src/main/libs/
        
